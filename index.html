<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17201c"><title>Soft Code Pro – Testversion</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#edf6ef;background:#151b18}*{box-sizing:border-box}body{margin:0}header{padding:19px 22px;background:#202a24;border-bottom:1px solid #33473b;display:flex;justify-content:space-between;align-items:center}header strong{color:#65d995;font-size:21px}header small{color:#b2c4b7}main{max-width:1100px;margin:auto;padding:20px}.badge{display:inline-block;padding:6px 10px;background:#304a38;color:#9af1b8;border-radius:10px;font-size:13px}nav{display:flex;gap:8px;overflow-x:auto;padding:15px 18px;background:#1b241e}button{border:1px solid #3b5946;background:#29372d;color:#edf6ef;border-radius:10px;padding:12px 15px;font-size:15px;cursor:pointer;white-space:nowrap}button.active{background:#28754c;border-color:#5cce8c}h1{font-size:27px}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#222e26;border:1px solid #34483a;border-radius:15px;padding:18px;margin:12px 0}.card h3{margin-top:0;color:#9be3b1}.muted{color:#b6c9bb}.warning{border-left:4px solid #d5a84f}.ok{color:#7fe6a3}select,input{background:#142019;color:white;border:1px solid #56745e;border-radius:8px;padding:12px;width:100%;font-size:16px}label{display:block;margin:12px 0 5px}.hidden{display:none}footer{color:#a7baab;font-size:12px;padding:20px;text-align:center}</style></head><body><header><strong>⚙ SOFT CODE PRO</strong><small>iPad · Deutsch</small></header><nav id="nav"></nav><main><span class="badge">TESTVERSION 0.1 · OHNE FAHRZEUGVERBINDUNG</span><section id="content"></section></main><footer>Prototyp – keine echten Diagnosedaten. Codierung und Flashen deaktiviert.</footer><script>
const names=['Übersicht','Fahrzeuge','Diagnose','Live-Daten','Codierung','Verlauf'];let current=0;const state={brand:localStorage.getItem('scp_brand')||'BMW',model:localStorage.getItem('scp_model')||'X1 E84',year:localStorage.getItem('scp_year')||'2010'};
function card(title,body,extra=''){return `<article class="card ${extra}"><h3>${title}</h3>${body}</article>`}
function render(){document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()">${n}</button>`).join('');let html='';switch(current){case 0:html='<h1>Werkstatt-Dashboard</h1><div class="grid">'+card('🚘 Testfahrzeug',`<b id="vehicle">${esc(state.brand)} ${esc(state.model)}</b><p class="muted">Baujahr ${esc(state.year)} · manuell eingetragen</p>`)+card('🔌 Diagnoseadapter','<b>OBDLink CX</b><p class="muted">Nicht verbunden</p>')+card('🛡 Schreibschutz','<b class="ok">Aktiv</b><p class="muted">Keine Schreibbefehle verfügbar</p>')+card('📊 Datenstatus','<b>Keine Daten</b><p class="muted">Noch kein Steuergerät ausgelesen</p>')+'</div>'+card('Hinweis','Dies ist eine bedienbare Vorschau. Fahrzeugdaten werden nicht ausgelesen; Diagnosen und Codierungen sind noch nicht möglich.','warning');break;case 1:html='<h1>Fahrzeugverwaltung</h1>'+card('Fahrzeug für die Vorschau auswählen','<label>Hersteller</label><select id="brand">'+['BMW','MINI','Volkswagen','Audi','SEAT','Škoda','Mercedes-Benz','Opel','Ford'].map(b=>`<option ${state.brand===b?'selected':''}>${b}</option>`).join('')+'</select><label>Modell / Baureihe</label><input id="model" maxlength="60" placeholder="z. B. X1 E84" value="'+esc(state.model)+'"><label>Baujahr</label><input id="year" type="number" min="1950" max="2100" value="'+esc(state.year)+'"><p><button onclick="saveVehicle()">Fahrzeug speichern</button></p><p class="muted">Nur manuelle Eingabe. Keine automatische VIN-Erkennung.</p>');break;case 2:html='<h1>Diagnose</h1>'+card('Steuergeräte','Noch keine Steuergeräte ausgelesen. Adapterverbindung ist nicht implementiert.')+card('Fehlerspeicher','Keine Diagnosedaten vorhanden. Es werden keine Demo-Fehler als echte Fehler ausgegeben.');break;case 3:html='<h1>Live-Daten</h1>'+card('Messwerte','Keine Live-Daten verfügbar. Sobald eine geprüfte Verbindung implementiert ist, erscheinen hier Messwerte mit Einheit und Zeitstempel.');break;case 4:html='<h1>Codierung & Anpassungen</h1>'+card('Schreibzugriff gesperrt','Codierungen, Anpassungen und Flashvorgänge sind in dieser Testversion vollständig deaktiviert.','warning')+card('Geplante Schutzmaßnahmen','Fahrzeug- und Steuergeräteidentifikation, Spannungsprüfung, Verbindungstest, Backup und Prüfung vor jedem Schreibvorgang.');break;case 5:html='<h1>Verlauf</h1>'+card('Diagnose- und Codierhistorie','Noch keine Einträge. Die Speicherung echter Diagnoseberichte ist für eine spätere Version geplant.');break;}document.getElementById('content').innerHTML=html}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveVehicle(){state.brand=document.getElementById('brand').value;state.model=document.getElementById('model').value.trim()||'Nicht angegeben';state.year=document.getElementById('year').value||'Nicht angegeben';for(const k of ['brand','model','year'])localStorage.setItem('scp_'+k,state[k]);current=0;render()}render();</script></body></html>
