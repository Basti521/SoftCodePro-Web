<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1b1f"><title>Soft Code Pro 0.3</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f4f5;background:#19191d}*{box-sizing:border-box}body{margin:0}header{background:#242428;padding:20px max(18px,4vw);border-bottom:1px solid #45454d}h1{color:#ff626b;font-size:23px;margin:0}nav{display:flex;gap:8px;overflow:auto;padding:15px max(18px,4vw);background:#27272d}button,input,select{font:inherit}button{border:1px solid #62626d;background:#393940;color:#fff;border-radius:10px;padding:11px 14px;cursor:pointer}button.active,.primary{background:#b91c2b;border-color:#f15b65}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1200px;margin:auto;padding:22px}h2{margin:12px 0 20px}.badge{display:inline-block;background:#a3212d;color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#303036;border:1px solid #51515a;border-radius:13px;padding:20px;margin-bottom:14px;overflow-wrap:anywhere}.card h3{margin-top:0;color:#ff8d94}p{line-height:1.5}.muted{color:#c7c7cd}.notice{border-left:5px solid #f1c55b}.field{display:grid;gap:6px;margin-bottom:12px}input,select{width:100%;padding:12px;border:1px solid #64646e;border-radius:8px;background:#222228;color:#fff}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.entry{border-top:1px solid #4a4a53;padding:12px 0}.entry:first-of-type{border-top:0}.small{font-size:13px}footer{text-align:center;padding:30px;color:#b9b9c1}.hidden{display:none}canvas{width:100%;max-height:230px;background:#222228;border-radius:8px} @media(max-width:600px){main{padding:15px}.card{padding:15px}nav button{white-space:nowrap}}</style></head><body><header><h1>⚙ SOFT CODE PRO</h1><span class="small">iPad · Deutsch · Version 0.3</span></header><nav id="nav"></nav><main><span class="badge">TESTVERSION 0.3 · OHNE FAHRZEUGVERBINDUNG</span><section id="content" aria-live="polite"></section></main><footer>Prototyp – keine Fahrzeugkommunikation in Safari. Codierung und Flashen deaktiviert.</footer><script>
'use strict';const KEY='softcodepro-v02';const pages=['Übersicht','Fahrzeuge','Adapter','Diagnose','Live-Daten','Codierung','Verlauf'];let page='Übersicht';const initial={vehicles:[{id:'sample-e84',make:'BMW',model:'X1 E84',year:'2010',vin:''}],selected:'sample-e84',history:[]};let data;try{const raw=JSON.parse(localStorage.getItem(KEY));data=raw&&Array.isArray(raw.vehicles)&&Array.isArray(raw.history)?raw:structuredClone(initial)}catch{data=structuredClone(initial)}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function vehicle(){return data.vehicles.find(v=>v.id===data.selected)||null}function label(v){return v?`${v.make} ${v.model} (${v.year})`:'Kein Fahrzeug ausgewählt'}function addHistory(type,description){data.history.unshift({id:Date.now()+'-'+Math.random(),time:new Date().toISOString(),type,description});data.history=data.history.slice(0,200);save()}function navigate(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');const v=vehicle();let html=`<h2>${esc(page==='Übersicht'?'Werkstatt-Dashboard':page==='Fahrzeuge'?'Fahrzeugverwaltung':page==='Adapter'?'Adapterverbindung':page==='Codierung'?'Codierung & Anpassungen':page)}</h2>`;if(page==='Übersicht')html+=`<div class="grid"><div class="card"><h3>🚗 Aktuelles Fahrzeug</h3><strong>${esc(label(v))}</strong><p class="muted">${v?.vin?'VIN: '+esc(v.vin):'VIN nicht hinterlegt'} · Manuell eingetragen</p></div><div class="card"><h3>🔌 Diagnoseadapter</h3><strong>OBDLink CX</strong><p>App-Verbindung: Nicht verbunden · Bluetooth in Safari nicht verfügbar</p></div><div class="card"><h3>🛡 Schreibschutz</h3><strong>Aktiv</strong><p>Keine Schreibbefehle verfügbar</p></div><div class="card"><h3>📊 Datenstatus</h3><strong>Keine echten Messwerte</strong><p>Noch kein Steuergerät ausgelesen</p></div><div class="card"><h3>📁 Gespeicherte Daten</h3><strong>${data.vehicles.length} Fahrzeug(e)</strong><p>${data.history.length} lokale Verlaufseinträge</p></div></div>`;if(page==='Fahrzeuge')html+=`<div class="card"><h3>Fahrzeug hinzufügen / bearbeiten</h3><form id="vehicle-form"><input type="hidden" id="edit-id"><label class="field">Hersteller<select id="make" required><option>BMW</option><option>MINI</option><option>Volkswagen</option><option>Audi</option><option>SEAT</option><option>Škoda</option><option>Mercedes-Benz</option><option>Opel</option><option>Ford</option></select></label><label class="field">Modell / Baureihe<input id="model" required maxlength="80" placeholder="z. B. X1 E84"></label><label class="field">Baujahr<input id="year" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="2010"></label><label class="field">VIN (optional, manuell)<input id="vin" maxlength="17" placeholder="17 Zeichen"></label><div class="row"><button class="primary" type="submit">Fahrzeug speichern</button><button type="button" id="reset-form">Neues Fahrzeug</button></div></form><p class="small muted">Keine automatische VIN-Erkennung. Angaben werden ausschließlich lokal in diesem Browser gespeichert.</p></div><div class="card"><h3>Gespeicherte Fahrzeuge</h3>${data.vehicles.length?data.vehicles.map(x=>`<div class="entry"><strong>${esc(label(x))}</strong> ${x.id===data.selected?'<span class="badge">Aktiv</span>':''}<p class="small">${x.vin?'VIN: '+esc(x.vin):'VIN nicht hinterlegt'}</p><div class="row"><button data-select="${esc(x.id)}">Auswählen</button><button data-edit="${esc(x.id)}">Bearbeiten</button><button data-delete="${esc(x.id)}">Löschen</button></div></div>`).join(''):'Noch keine Fahrzeuge gespeichert.'}</div>`;if(page==='Adapter')html+=`<div class="grid"><div class="card"><h3>🔌 Adapter</h3><strong>OBDLink CX</strong><p>Bluetooth Low Energy (BLE)</p><span class="badge">SOFT CODE PRO: NICHT VERBUNDEN</span></div><div class="card"><h3>🚗 Aktuelles Fahrzeug</h3><strong>${esc(label(v))}</strong><p class="small muted">Aus der lokalen Fahrzeugverwaltung · Nicht automatisch erkannt</p></div><div class="card"><h3>🛡 Sicherheit</h3><strong>Nur Lesekonzept</strong><p>Keine Adapterbefehle, keine Codierung, kein Flashen.</p></div></div><div class="card notice"><h3>Warum ist die Verbindung hier nicht aktiv?</h3><p>Deine OBDLink-App kann mit dem CX kommunizieren. Safari auf dem iPad bietet unserer Webseite jedoch keinen passenden direkten BLE-Zugriff. Die OBDLink-Verbindung wird nicht automatisch an Soft Code Pro weitergegeben.</p><button disabled>Mit OBDLink CX verbinden – native iPad-App erforderlich</button></div><div class="card"><h3>Prüfliste für die spätere native Anbindung</h3><p>Diese Häkchen dokumentieren nur deine eigenen Tests in der OBDLink-App. Sie stellen keine Verbindung in Soft Code Pro her.</p><label class="field"><span><input type="checkbox" id="check-ble" style="width:auto"> OBDLink-App verbindet sich mit dem CX</span></label><label class="field"><span><input type="checkbox" id="check-live" style="width:auto"> Echte Live-Werte werden in der OBDLink-App angezeigt</span></label><label class="field"><span><input type="checkbox" id="check-dtc" style="width:auto"> Fehlerspeicher ist in der OBDLink-App lesbar</span></label><button id="save-checks" class="primary">Prüfstatus lokal speichern</button><p id="check-status" class="small muted">Noch keine Prüfliste gespeichert.</p></div><div class="card"><h3>Nächste technische Umsetzung</h3><p>Native iPadOS-BLE-Komponente, geprüfte OBDLink-CX-Kommunikation, Verbindungsüberwachung, echte Daten mit Quelle und Zeitstempel. Für die iPad-App-Erstellung ist eine macOS/Xcode-Buildumgebung erforderlich; ein eigener Mac ist nicht zwingend nötig.</p></div>`;if(page==='Diagnose')html+=`<div class="card"><h3>🚗 Fahrzeug</h3><p>${esc(label(v))}</p></div><div class="card"><h3>Steuergeräte</h3><p>Noch keine Steuergeräte ausgelesen. Adapterverbindung ist nicht implementiert.</p></div><div class="card"><h3>Fehlerspeicher</h3><p>Keine Diagnosedaten vorhanden. Es werden keine Demo-Fehler als echte Fehler ausgegeben.</p></div><div class="card notice"><h3>Geplanter Ablauf</h3><p>Adapter verbinden → Steuergeräte identifizieren → Fehlercodes lesen → Diagnosebericht speichern. Aktuell nicht verfügbar.</p><button disabled>Diagnose starten (noch nicht verfügbar)</button></div>`;if(page==='Live-Daten')html+=`<div class="card"><h3>Messwerte</h3><p>Keine Live-Daten verfügbar. Erst nach einer geprüften Verbindung erscheinen hier echte Werte mit Einheit, Zeitstempel und Quelle.</p></div><div class="grid">${['Motordrehzahl · U/min','Kühlmitteltemperatur · °C','Fahrzeuggeschwindigkeit · km/h','Batteriespannung · V','Motorlast · %','Ansauglufttemperatur · °C'].map(s=>`<div class="card"><h3>${s}</h3><strong>—</strong><p class="small muted">Nicht verfügbar · Keine Messung</p></div>`).join('')}</div><div class="card"><h3>Diagramm (Platzhalter)</h3><p>Keine Kurve ohne echte Messdaten.</p><canvas id="chart" height="150" aria-label="Leeres Diagramm"></canvas></div>`;if(page==='Codierung')html+=`<div class="card notice"><h3>🔒 Schreibzugriff gesperrt</h3><p>Codierungen, Anpassungen und Flashvorgänge sind in dieser Testversion vollständig deaktiviert.</p></div><div class="card"><h3>Einfacher Modus · geplant</h3><p>Unterstützte Funktionen mit verständlichen Beschreibungen und geprüfter Fahrzeugkompatibilität.</p><button disabled>Funktion ändern (gesperrt)</button></div><div class="card"><h3>Expertenmodus · geplant</h3><p>Steuergeräteparameter nur nach Identitäts-, Spannungs-, Verbindungs- und Backup-Prüfung bearbeiten.</p><button disabled>Expertenmodus (gesperrt)</button></div>`;if(page==='Verlauf')html+=`<div class="card"><h3>Lokale Fahrzeug- und Änderungshistorie</h3><p class="small muted">Nur manuelle Fahrzeugaktionen; keine echten Diagnose- oder Codierprotokolle.</p>${data.history.length?data.history.map(h=>`<div class="entry"><strong>${esc(h.type)}</strong> · <time>${esc(new Date(h.time).toLocaleString('de-DE'))}</time><p>${esc(h.description)}</p></div>`).join(''):'Noch keine Einträge.'}<div class="row"><button id="export-data">Daten als JSON exportieren</button></div></div><div class="card notice"><h3>Datenspeicherung</h3><p>Die Einträge liegen nur im Browser dieses Geräts. Beim Löschen von Websitedaten können sie verloren gehen. Nutze den Export als Sicherung.</p></div>`;document.getElementById('content').innerHTML=html;if(page==='Adapter'){let checks={};try{checks=JSON.parse(localStorage.getItem('softcodepro-adapter-checks')||'{}')}catch{}for(const k of ['ble','live','dtc'])document.getElementById('check-'+k).checked=!!checks[k];if(checks.savedAt)document.getElementById('check-status').textContent='Prüfstatus gespeichert: '+new Date(checks.savedAt).toLocaleString('de-DE')+' · Nur manuell bestätigt.'}if(page==='Live-Daten'){const c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.strokeStyle='#55555f';for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,i*30);ctx.lineTo(c.width,i*30);ctx.stroke()}}}document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='save-checks'){const checks={savedAt:new Date().toISOString(),ble:document.getElementById('check-ble').checked,live:document.getElementById('check-live').checked,dtc:document.getElementById('check-dtc').checked};try{localStorage.setItem('softcodepro-adapter-checks',JSON.stringify(checks));document.getElementById('check-status').textContent='Prüfstatus lokal gespeichert · Keine App-Verbindung hergestellt.'}catch{alert('Speichern nicht möglich.')}return}if(b.dataset.select){data.selected=b.dataset.select;save();addHistory('Fahrzeug ausgewählt',label(vehicle()));render()}else if(b.dataset.edit){const v=data.vehicles.find(x=>x.id===b.dataset.edit);if(!v)return;for(const key of ['make','model','year','vin'])document.getElementById(key).value=v[key]||'';document.getElementById('edit-id').value=v.id;document.getElementById('model').focus()}else if(b.dataset.delete){const v=data.vehicles.find(x=>x.id===b.dataset.delete);if(v&&confirm(`${label(v)} wirklich löschen?`)){data.vehicles=data.vehicles.filter(x=>x.id!==v.id);if(data.selected===v.id)data.selected=data.vehicles[0]?.id||null;save();addHistory('Fahrzeug gelöscht',label(v));render()}}else if(b.id==='reset-form'){document.getElementById('vehicle-form').reset();document.getElementById('edit-id').value=''}else if(b.id==='export-data'){const blob=new Blob([JSON.stringify({app:'Soft Code Pro',version:'0.3',exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SoftCodePro-Daten.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});document.getElementById('content').addEventListener('submit',e=>{if(e.target.id!=='vehicle-form')return;e.preventDefault();const make=document.getElementById('make').value,model=document.getElementById('model').value.trim(),year=document.getElementById('year').value.trim(),vin=document.getElementById('vin').value.trim().toUpperCase(),id=document.getElementById('edit-id').value;if(!model||!/^(19|20|21)\d{2}$/.test(year)){alert('Bitte Modell und ein gültiges vierstelliges Baujahr eingeben.');return}if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){alert('VIN bitte leer lassen oder 17 gültige Zeichen eingeben.');return}const v={id:id||('v-'+Date.now()),make,model,year,vin};if(id){const i=data.vehicles.findIndex(x=>x.id===id);if(i<0)return;data.vehicles[i]=v}else data.vehicles.push(v);data.selected=v.id;if(!save())alert('Speichern im Browser fehlgeschlagen. Bitte Speicherplatz prüfen.');addHistory(id?'Fahrzeug bearbeitet':'Fahrzeug hinzugefügt',label(v));render()});render();
</script></body></html>
